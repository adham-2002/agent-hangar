name: Upstream watch

# Weekly reminder of new commits in the original project
# (xingkongliang/skills-manager) that this fork has neither taken nor
# skipped. See docs/UPSTREAM.md.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    if: github.repository != 'xingkongliang/skills-manager'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the report
        run: |
          # The in-order check writes throwaway commits, which need an author.
          git config user.name "upstream-watch"
          git config user.email "upstream-watch@users.noreply.github.com"
          node scripts/upstream.mjs --markdown > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
        # REST only: `gh issue create` goes through GraphQL, which the workflow
        # token is refused ("Resource not accessible by integration").
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)" != "true" ]; then
            echo "Issues are disabled for this repository; see the run summary."
            exit 0
          fi
          count=$(head -1 report.md | grep -oE '^[0-9]+' || echo 0)
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100"             --jq '[.[] | select(.pull_request == null and .title == "Upstream updates")][0].number // empty')
          if [ "$count" = "0" ]; then
            if [ -n "$existing" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$existing/comments" -f body="Nothing new upstream." >/dev/null
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$existing" -f state=closed >/dev/null
            fi
            exit 0
          fi
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$existing" -F body=@report.md >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues" -f title="Upstream updates" -F body=@report.md >/dev/null
          fi
